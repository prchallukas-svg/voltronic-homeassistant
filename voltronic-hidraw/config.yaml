name: Voltronic Inverter (USB / HID)
version: "1.1.1"
slug: voltronic_hidraw
description: Monitor and control a Voltronic / MPP / Axpert inverter connected over USB (/dev/hidraw*)
arch:
  - amd64
  - i386
  - aarch64
init: false
host_network: true
privileged:
  - SYS_MODULE
  - SYS_RAWIO
usb: true
services:
  - mqtt:need
options:
  device: /dev/hidraw0
  poll_interval: 30
  amperage_factor: 1.0
  watt_factor: 1.0
schema:
  device: "device(subsystem=hidraw)?"
  poll_interval: "int(5,3600)"
  amperage_factor: float
  watt_factor: float
